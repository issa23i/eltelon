<section>
  <header tuiHeader="body-l">
    <h3 tuiTitle>{{ firstTitle }}</h3>
  </header>

  <p>{{ paragraphText }}</p>

  @if (imageSrc) {
    <figure class="news-image">
      <img [src]="imageSrc" [alt]="imageAlt" />
    </figure>
  }

  <div tuiHeader="body-l">
    <h3 tuiTitle class="pt-32">{{ secondTitle }}</h3>
  </div>

  @if (hasButton) {
    <section class="button pt-32">
      <a href="/casting#form" target="_blank">
        <button appearance="accent" tuiButton type="button" class="animado">
          Contacto
        </button>
      </a>
    </section>
  }
</section>
