<form
  name="contacto"
  method="POST"
  data-netlify="true"
  netlify-honeypot="bot-field"
  ngNoForm
  tuiForm="l"
  [style.max-width.rem]="35"
  class="formulario"
>
  <p class="honeypot" aria-hidden="true">
    <label>No rellenes este campo <input name="bot-field" tabindex="-1" /></label>
  </p>

  <tui-textfield>
    <label tuiLabel>Nombre</label>
    <input tuiTextfield name="nombre" placeholder="Nombre" required />
  </tui-textfield>

  <tui-textfield>
    <label tuiLabel>Primer apellido</label>
    <input tuiTextfield name="apellido1" placeholder="Primer apellido" required />
  </tui-textfield>

  <tui-textfield>
    <label tuiLabel>Segundo apellido (opcional)</label>
    <input tuiTextfield name="apellido2" placeholder="Segundo apellido (opcional)" />
  </tui-textfield>

  <tui-textfield>
    <label tuiLabel>Teléfono de contacto</label>
    <input
      tuiTextfield
      type="tel"
      name="telefono"
      placeholder="Teléfono de contacto"
      inputmode="tel"
      required
    />
  </tui-textfield>

  <tui-textfield>
    <label tuiLabel>Mensaje</label>
    <textarea
      name="mensaje"
      placeholder="Escribe tu mensaje aquí (opcional)"
      tuiTextarea
    ></textarea>
  </tui-textfield>

  <label class="checkbox-row">
    <input type="checkbox" name="privacidad" value="aceptada" required />
    He leído y acepto la
    <a href="/privacidad" target="_blank"> política de privacidad </a>
  </label>

  <label class="checkbox-row">
    <input type="checkbox" name="condiciones" value="aceptadas" required />
    Acepto las
    <a href="/aviso-legal" target="_blank"> condiciones legales </a>
  </label>

  <button appearance="outline" tuiButton size="l" type="submit">Enviar</button>
</form>
